<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目打包客户端</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/app.css?v=202609021600">
</head>
<body>

<!-- ================================================================
     Toast 消息容器
     ================================================================ -->
<div id="toastContainer" class="toast-container"></div>

<!-- ================================================================
     登录页
     ================================================================ -->
<div id="loginPage">
    <div class="login-card">
        <h2>项目打包客户端</h2>
        <p class="subtitle">请输入账号密码登录后继续</p>

        <div class="form-group">
            <label>账号</label>
            <input type="text" id="loginUsername" class="form-input" placeholder="账号" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="密码" autocomplete="current-password">
        </div>
        <button id="loginButton" class="btn btn-primary" style="width:100%; margin-top: 8px;">登录</button>
    </div>
</div>

<!-- ================================================================
     主页面
     ================================================================ -->
<div id="mainPage">
    <!-- Header -->
    <div class="app-header">
        <h1>项目打包工作台</h1>
        <span class="subtitle">三栏联动选择项目、版本与服务组件</span>
        <div class="automation-header-actions">
            <button type="button" id="automationStatus" class="automation-status status-unconfigured">
                <span class="automation-status-dot" aria-hidden="true"></span>
                <span id="automationStatusText">自动打包未配置</span>
            </button>
            <button type="button" id="automationSettingsButton" class="automation-settings-button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 8.25A3.75 3.75 0 1 0 12 15.75 3.75 3.75 0 0 0 12 8.25Zm8.1 4.86v-2.22l-2.08-.74a6.64 6.64 0 0 0-.65-1.57l.95-1.99-1.57-1.57-1.99.95a6.64 6.64 0 0 0-1.57-.65L12.45 3h-2.22l-.74 2.08a6.64 6.64 0 0 0-1.57.65l-1.99-.95-1.57 1.57.95 1.99a6.64 6.64 0 0 0-.65 1.57l-2.08.74v2.22l2.08.74c.15.55.37 1.08.65 1.57l-.95 1.99 1.57 1.57 1.99-.95c.49.28 1.02.5 1.57.65l.74 2.08h2.22l.74-2.08a6.64 6.64 0 0 0 1.57-.65l1.99.95 1.57-1.57-.95-1.99c.28-.49.5-1.02.65-1.57l2.08-.74Z"/>
                </svg>
                <span>设置</span>
            </button>
        </div>
        <div class="user-menu" id="userMenu">
            <button type="button" class="user-menu-trigger" id="userMenuTrigger" aria-haspopup="true" aria-expanded="false">
                <span class="user-avatar" aria-hidden="true">👤</span>
                <span class="user-name" id="userMenuName">当前用户</span>
                <span class="user-menu-caret" aria-hidden="true">⌄</span>
            </button>
            <div class="user-menu-panel" id="userMenuPanel" role="menu">
                <button type="button" class="user-menu-item" id="userProfileButton" role="menuitem">个人信息</button>
                <button type="button" class="user-menu-item danger" id="logoutButton" role="menuitem">退出登录</button>
            </div>
        </div>
    </div>

    <!-- Three-column splitter -->
    <div class="splitter">

        <!-- ============ 左栏：项目管理 ============ -->
        <div class="card splitter-panel">
            <h3>项目管理</h3>
            <input type="text" id="projectSearch" class="form-input search-input"
                   placeholder="搜索项目...">

            <div class="pivot">
                <button id="pivotFav" class="pivot-btn active">我的收藏</button>
                <button id="pivotAll" class="pivot-btn">全量项目</button>
            </div>

            <div id="favoriteList" class="list-scroll"></div>
            <div id="allProjectList" class="list-scroll hidden"></div>
            <div id="projectPagination" class="project-pagination hidden">
                <button id="projectPrevPage" class="btn btn-sm">上一页</button>
                <span id="projectPageInfo" class="muted">第 1 / 1 页，共 0 个项目</span>
                <button id="projectNextPage" class="btn btn-sm">下一页</button>
            </div>
        </div>

        <div class="splitter-handle" data-handle="0" role="separator" aria-orientation="vertical" tabindex="0"></div>

        <!-- ============ 中栏：版本选择 ============ -->
        <div class="card splitter-panel">
            <h3>版本选择</h3>
            <input type="text" id="versionSearch" class="form-input search-input"
                   placeholder="搜索版本...">
            <p id="versionHint" class="hint">请选择左侧项目</p>
            <div id="versionList" class="list-scroll"></div>
        </div>

        <div class="splitter-handle" data-handle="1" role="separator" aria-orientation="vertical" tabindex="0"></div>

        <!-- ============ 右栏：组件配置与打包 ============ -->
        <div id="rightPanel" class="card splitter-panel right-panel">
            <div id="rightPanelLoading" class="right-panel-loading hidden" aria-live="polite">
                <div class="right-panel-loading-content">
                    <div class="right-panel-spinner"></div>
                    <span id="rightPanelLoadingText">组件加载中...</span>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-shrink:0;">
                <h3 style="margin-bottom:0;">组件配置与打包</h3>
                <p id="packageHint" class="hint" style="margin-bottom:0;">请选择中间栏版本</p>
                <div id="moduleLoading" class="loading-ring hidden"></div>
            </div>

            <!-- 业务组件 -->
            <h4 style="margin-bottom:6px; flex-shrink:0;">业务组件</h4>
            <div class="module-tools">
                <label class="select-all-label">
                    <input type="checkbox" id="selectAllCheckbox" checked>
                    全选
                </label>
                <input type="text" id="moduleSearch" class="form-input search-input"
                       placeholder="过滤服务...">
            </div>
            <div id="moduleList" class="list-scroll flex-fill"></div>

            <!-- 操作按钮 -->
            <div class="actions-row">
                <span class="spacer"></span>
                <button id="cancelButton" class="btn">取消</button>
                <button id="packButton" class="btn btn-primary" disabled>开始打包</button>
            </div>
        </div>
    </div>
</div>

<!-- 自动打包目标设置抽屉 -->
<div id="automationDrawer" class="automation-drawer" aria-hidden="true">
    <button type="button" id="automationDrawerMask" class="automation-drawer-mask" aria-label="关闭设置"></button>
    <aside class="automation-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="automationDrawerTitle">
        <div class="automation-drawer-head">
            <div>
                <p class="automation-drawer-kicker">AUTOMATED RELEASE</p>
                <h2 id="automationDrawerTitle">自动打包设置</h2>
                <p>固定一个项目和产品，发布任务将按 Git URL 自动定位服务。</p>
            </div>
            <button type="button" id="automationDrawerClose" class="automation-drawer-close" aria-label="关闭">×</button>
        </div>
        <div id="automationDrawerNotice" class="automation-drawer-notice hidden" role="status"></div>
        <div class="automation-field">
            <label for="automationProjectInput">项目</label>
            <div class="automation-combobox">
                <input type="text" id="automationProjectInput" class="form-input" placeholder="输入项目名称搜索" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="automationProjectOptions">
                <div id="automationProjectOptions" class="automation-options" role="listbox"></div>
            </div>
            <p class="automation-field-help">必须从真实候选中选择，输入文本不会作为 ID 保存。</p>
        </div>
        <div class="automation-field">
            <label for="automationVersionInput">产品</label>
            <div class="automation-combobox">
                <input type="text" id="automationVersionInput" class="form-input" placeholder="请先选择项目" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="automationVersionOptions" disabled>
                <div id="automationVersionOptions" class="automation-options" role="listbox"></div>
            </div>
        </div>
        <div id="automationAudit" class="automation-audit hidden">
            <div><span>创建人</span><strong id="automationCreatedBy">-</strong></div>
            <div><span>创建时间</span><strong id="automationCreatedAt">-</strong></div>
            <div><span>最后修改人</span><strong id="automationUpdatedBy">-</strong></div>
            <div><span>最后修改时间</span><strong id="automationUpdatedAt">-</strong></div>
        </div>
        <div class="automation-drawer-actions">
            <button type="button" id="automationCancel" class="btn btn-secondary">取消</button>
            <button type="button" id="automationSave" class="btn btn-primary">保存设置</button>
        </div>
    </aside>
</div>

<!-- ================================================================
     通用弹窗
     ================================================================ -->
<div id="modalOverlay" class="modal-overlay">
    <div id="modalBody" class="modal-body">
        <button id="modalCloseBtn" class="edit-branch-btn"
                style="position:absolute; top:12px; right:12px;"
                title="关闭">✕</button>
    </div>
</div>

<!-- 系统确认弹窗 -->
<div id="confirmOverlay" class="modal-overlay confirm-overlay" role="dialog"
     aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
    <div class="modal-body confirm-dialog">
        <div id="confirmIcon" class="confirm-icon" aria-hidden="true">!</div>
        <div class="confirm-content">
            <h3 id="confirmTitle">操作确认</h3>
            <p id="confirmMessage">请确认是否继续当前操作。</p>
        </div>
        <div class="modal-actions confirm-actions">
            <button type="button" id="confirmCancel" class="btn btn-secondary">取消</button>
            <button type="button" id="confirmSubmit" class="btn btn-primary">确认</button>
        </div>
    </div>
</div>

<!-- ================================================================
     JavaScript
     ================================================================ -->
    <script src="js/utils.js?v=202607201910"></script>
    <script src="js/config.js?v=202607201910"></script>
    <script src="js/api.js?v=202609021600"></script>
    <script src="js/app.js?v=202609021600"></script>

</body>
</html>
